; 1.8.0
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC="Image sync"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_DESC="Sync keeps the intro and full article images one picture: the panel writes it into both fields with its description, classes and caption. With the switch, the editor decides per article: on opening, the switch is on when both fields hold the same image and off when the images differ or one field is empty; a new article takes the default. Always is the behaviour of earlier versions, without the switch."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ON="Switch in the panel, on by default"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_OFF="Switch in the panel, off by default"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ALWAYS="Always, no switch"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_SWITCH="One image for the intro and full article"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_HELP="Turn off to give the full article a different image or none. The full article image is then chosen in the native field below, with its own description, caption and watermark."

; 1.9.0
PLG_SYSTEM_CONTENTIMAGEUPLOAD_DROP_HINT="You can also drop a file onto this panel."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_THUMB_CACHE="JUImage thumbnail folders"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_THUMB_CACHE_DESC="Folders, relative to the site root and comma-separated, where the template keeps JUImage thumbnails; img for wmarka. JUImage does not notice that an image changed, so after adding or removing the watermark the plugin deletes the thumbnails of that image there, and the template draws them again. Leave empty if the site has no JUImage. The images folder and its subfolders are not accepted."

