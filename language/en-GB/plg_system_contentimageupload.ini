PLG_SYSTEM_CONTENTIMAGEUPLOAD_FOLDER_FORMAT_DESC="<strong>Path variables</strong><br>{user_id} — current user ID<br>{year} — current year<br>{month} — current month<br>{week_year} — week number in the year<br>{week_day} — weekday number starting from 0<br>{day_year} — day of year starting from 0<br>{day} — current day<br>{hours} — 12-hour clock with leading zero<br>{hours_24} — 24-hour clock with leading zero<br>{minutes} — minutes<br>{seconds} — seconds<br>{unix} — Unix timestamp<br><br><strong>Example usage:</strong><br>images/{user_id}/{year}-{month}-{day}<br>images/{user_id}/{year}/{month}/{day}<br><br>Default: images/{year}/{month}/{day}. You can change the path manually in the plugin settings."
