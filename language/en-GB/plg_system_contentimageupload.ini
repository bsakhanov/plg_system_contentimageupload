PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_MODE_DESC="Controls how uploaded filenames are generated: random name, date plus hash, or a safe version of the original filename."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_SUFFIX_DESC="Suffix added to random filenames. Used only with the random-name mode."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSING_ENABLED_DESC="Enables image processing after upload, including resizing and/or conversion to the selected format."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSOR_BACKEND_DESC="Selects the image processing backend. Joomla Core Image is currently supported and uses Joomla’s image API and the PHP GD extension. The list is ready for additional backends."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_RESIZE_MODE_DESC="Controls the final dimensions. Do not resize keeps the original size; Fit inside bounds preserves proportions and adds canvas space; Crop fills the exact size by cropping; Match width/height uses the corresponding limit."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_MAX_WIDTH_DESC="Maximum result width in pixels. In Fit inside bounds mode this is the canvas width. Set to 0 for no width limit."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_FILL_COLOR_DESC="Fill color for empty canvas areas when using Fit inside bounds mode."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_ALLOW_UPSCALE_DESC="Allows images smaller than the configured dimensions to be enlarged. Upscaling can reduce visual quality."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_OUTPUT_FORMAT_DESC="Select the format Joomla saves after processing. Keep original preserves the source format; WEBP and AVIF availability depends on the server GD extension."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_QUALITY_DESC="Compression quality for JPG, WEBP, and AVIF. Higher values usually improve quality but increase file size. This does not affect PNG."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PNG_COMPRESSION_DESC="PNG compression level from 0 to 9. Higher values usually reduce file size at the cost of longer processing."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_STRICT_MODE_DESC="When disabled, processing errors fall back to the original upload. When enabled, the upload fails if resizing or conversion cannot be completed."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_ENABLED_DESC="Shows the Watermark box in the article editor. Before adding the watermark the plugin keeps the original in the hidden folder images/.contentimageupload, so the watermark can be removed later."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_POSITION_DESC="Controls the watermark position. Corner positions use the horizontal and vertical margins; Center places the watermark in the middle of the image."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_OPACITY_DESC="Watermark opacity. 100 means fully opaque; lower values make the watermark more transparent."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_X_DESC="Horizontal distance in pixels from the left or right image edge. Not used for the Center position."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_Y_DESC="Vertical distance in pixels from the top or bottom image edge. Not used for the Center position."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_HIDE_LINK_FIELDSETS="Hide link fieldsets"

