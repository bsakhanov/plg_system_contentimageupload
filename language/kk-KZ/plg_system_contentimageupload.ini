PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ALWAYS="Әрқашан, ауыстырғышсыз"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_SWITCH="Кіріспе және толық мәтінге бір сурет"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_HELP="Толық мәтінге басқа сурет қою немесе оны суретсіз қалдыру үшін өшіріңіз. Сонда толық мәтін суреті төмендегі төл өрісте өз сипаттамасымен, жазуымен және су белгісімен таңдалады."

