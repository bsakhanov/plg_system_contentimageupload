PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_MODE_DESC="Жүктелетін файл атауын қалыптастыру тәсілін анықтайды: кездейсоқ атау, күн + hash немесе бастапқы атаудың қауіпсіз нұсқасы."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_SUFFIX_DESC="Кездейсоқ файл атауына қосылатын суффикс. Тек «Суффиксі бар кездейсоқ атау» режимінде қолданылады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSING_ENABLED_DESC="Жүктелгеннен кейін суретті өңдеуді қосады: өлшемін өзгерту және/немесе таңдалған пішімге түрлендіру."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSOR_BACKEND_DESC="Суреттерді өңдеу механизмін таңдайды. Қазір Joomla Core Image қолданылады; ол Joomla-ның сурет API интерфейсін және PHP GD кеңейтімін пайдаланады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_RESIZE_MODE_DESC="Нәтиже өлшемінің қалай есептелетінін анықтайды. «Өзгертпеу» бастапқы өлшемді сақтайды; «Шекараға сыйдыру» пропорцияны сақтап, бос орын қосады; «Қиып алу» нақты өлшемді кесу арқылы алады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_MAX_WIDTH_DESC="Нәтиже енінің пиксельдегі максимумы. «Шекараға сыйдыру» режимінде бұл кенеп ені. Шектеусіз ету үшін 0 енгізіңіз."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_FILL_COLOR_DESC="«Шекараға сыйдыру» режиміндегі бос аймақтардың толтыру түсі."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_ALLOW_UPSCALE_DESC="Бапталған өлшемнен кіші суреттерді үлкейтуге мүмкіндік береді. Үлкейту сапаны төмендетуі мүмкін."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_OUTPUT_FORMAT_DESC="Өңдеуден кейін Joomla сақтайтын пішімді таңдаңыз. «Бастапқыны сақтау» бастапқы пішімді сақтайды; WEBP және AVIF қолжетімділігі сервердегі GD мүмкіндіктеріне байланысты."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_QUALITY_DESC="JPG, WEBP және AVIF үшін сығу сапасы. Үлкен мәндер әдетте сапаны жақсартады, бірақ файл көлемін арттырады. PNG-ге әсер етпейді."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PNG_COMPRESSION_DESC="PNG сығу деңгейі 0–9 аралығында. Үлкен мән файл көлемін азайтуы мүмкін, бірақ өңдеу ұзаққа созылады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_STRICT_MODE_DESC="Өшірулі болса, өңдеу қатесінде бастапқы файл сақталады. Қосулы болса, өлшем өзгерту немесе түрлендіру қатесі кезінде жүктеу тоқтатылады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_ENABLED_DESC="Мақала редакторында «Су белгісі» белгісін көрсетеді. Су белгісін қоймас бұрын плагин түпнұсқаны images/.contentimageupload жасырын бумасына сақтайды, сондықтан белгіні кейін алуға болады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_POSITION_DESC="Су белгісінің орналасуын анықтайды. Бұрыштарда көлденең және тік шегіністер қолданылады; орталық позиция суреттің ортасына орналастырады."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_OPACITY_DESC="Су белгісінің мөлдірлігі. 100 — толық мөлдір емес; кіші мәндер оны мөлдір етеді."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_X_DESC="Суреттің сол немесе оң шетінен пиксельдегі көлденең қашықтық. Орталық позицияда қолданылмайды."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_Y_DESC="Суреттің жоғарғы немесе төменгі шетінен пиксельдегі тік қашықтық. Орталық позицияда қолданылмайды."
