PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC="Суреттерді синхрондау"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_DESC="Синхрондау кіріспе және толық мәтін суреттерін бір сурет етіп ұстайды: панель оны сипаттамасымен, кластарымен және жазуымен бірге екі өріске де жазады. Ауыстырғыш болса, әр мақала үшін редактор өзі шешеді: мақала ашылғанда екі өрісте бір сурет тұрса, ауыстырғыш қосулы, суреттер әртүрлі болса немесе бір өріс бос болса — өшірулі; жаңа мақалаға әдепкі мән алынады. «Әрқашан» — бұрынғы нұсқалардағы тәртіп, ауыстырғышсыз."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ON="Панельдегі ауыстырғыш, әдепкіде қосулы"
