PLG_SYSTEM_CONTENTIMAGEUPLOAD_THUMB_CACHE_DESC="Шаблон JUImage миниатюраларын сақтайтын бумалар, сайт түбірінен бастап, үтір арқылы; wmarka үшін — img. JUImage суреттің өзгергенін байқамайды, сондықтан су белгісін қойғаннан немесе алғаннан кейін плагин осы бумалардағы сол суреттің миниатюраларын өшіреді, ал шаблон оларды қайта жасайды. Сайтта JUImage болмаса, өрісті бос қалдырыңыз. images бумасы мен оның ішкі бумалары қабылданбайды."
