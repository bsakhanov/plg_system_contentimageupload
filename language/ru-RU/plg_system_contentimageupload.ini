PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_MODE_DESC="Определяет способ формирования имени загружаемого файла: случайное имя, дата с hash или безопасное имя исходного файла."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_FILENAME_SUFFIX_DESC="Суффикс, добавляемый к случайному имени файла. Используется только для режима «Случайное имя с суффиксом»."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSING_ENABLED_DESC="Включает обработку изображения после загрузки: изменение размера и/или конвертацию в выбранный формат."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PROCESSOR_BACKEND_DESC="Выбирает движок обработки изображений. Сейчас поддерживается Joomla Core Image, использующий встроенный API изображений Joomla и PHP-расширение GD. Список подготовлен для подключения других обработчиков."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_RESIZE_MODE_DESC="Определяет, как рассчитывается итоговый размер. «Не изменять» сохраняет размеры; «Вписать в границы» сохраняет пропорции и добавляет поля; «Обрезать» заполняет точный размер с обрезкой; «Подогнать по ширине/высоте» ориентируется на соответствующий лимит."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_MAX_WIDTH_DESC="Максимальная ширина результата в пикселях. В режиме «Вписать в границы» это ширина холста. Укажите 0, чтобы не ограничивать ширину."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_FILL_COLOR_DESC="Цвет заливки пустых областей при режиме «Вписать в границы»."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_ALLOW_UPSCALE_DESC="Разрешает увеличивать изображения, которые меньше заданного размера. Увеличение может ухудшить качество."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_OUTPUT_FORMAT_DESC="Выберите формат, который Joomla сохранит после обработки. «Оставить исходный» сохраняет исходный формат; доступность WEBP и AVIF зависит от GD на сервере."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_QUALITY_DESC="Качество сжатия для JPG, WEBP и AVIF. Большие значения обычно дают лучшее качество, но увеличивают размер файла. На PNG не влияет."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_PNG_COMPRESSION_DESC="Уровень сжатия PNG от 0 до 9. Большее значение обычно уменьшает размер файла за счёт более длительной обработки."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_STRICT_MODE_DESC="Если выключен, при ошибке обработки сохраняется исходный файл. Если включён, загрузка прерывается при ошибке изменения размера или конвертации."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_ENABLED_DESC="Показывает в редакторе материала галочку «Водяной знак». Перед наложением знака плагин сохраняет оригинал в скрытой папке images/.contentimageupload, поэтому знак можно снять."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_POSITION_DESC="Определяет положение водяного знака. Для углов используются горизонтальный и вертикальный отступы; позиция по центру размещает знак в середине изображения."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_OPACITY_DESC="Прозрачность водяного знака. 100 — полностью непрозрачный знак; меньшие значения делают его прозрачнее."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_X_DESC="Горизонтальное расстояние в пикселях от левого или правого края изображения. Для позиции по центру не используется."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_WATERMARK_MARGIN_Y_DESC="Вертикальное расстояние в пикселях от верхнего или нижнего края изображения. Для позиции по центру не используется."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_HIDE_LINK_FIELDSETS="Скрыть блоки ссылок"

