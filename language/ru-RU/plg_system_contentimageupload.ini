; 1.8.0
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC="Синхронизация изображений"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_DESC="Синхронизация держит изображения вводного и полного текста одной картинкой: панель пишет её в оба поля вместе с описанием, классами и подписью. С переключателем редактор решает сам для каждого материала: при открытии материала переключатель включён, если в обоих полях одна картинка, и выключен, если картинки разные или одно поле пусто; для нового материала берётся значение по умолчанию. «Всегда» — поведение прежних версий, без переключателя."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ON="Переключатель в панели, по умолчанию включена"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_OFF="Переключатель в панели, по умолчанию выключена"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_IMAGE_SYNC_ALWAYS="Всегда, без переключателя"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_SWITCH="Одно изображение для вводного и полного текста"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_SYNC_HELP="Выключите, чтобы поставить в полный текст другую картинку или оставить его без картинки. Тогда изображение полного текста выбирается в родном поле ниже — со своими описанием, подписью и водяным знаком."

; 1.9.0
PLG_SYSTEM_CONTENTIMAGEUPLOAD_DROP_HINT="Файл можно перетащить на эту панель."
PLG_SYSTEM_CONTENTIMAGEUPLOAD_THUMB_CACHE="Папки миниатюр JUImage"
PLG_SYSTEM_CONTENTIMAGEUPLOAD_THUMB_CACHE_DESC="Папки от корня сайта через запятую, где шаблон хранит миниатюры JUImage; у wmarka это img. JUImage не замечает, что картинка изменилась, поэтому после наложения или снятия знака плагин удаляет здесь миниатюры этой картинки, и шаблон рисует их заново. Оставьте поле пустым, если JUImage на сайте нет. Папка images и её подпапки не принимаются."
