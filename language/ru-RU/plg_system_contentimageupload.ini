PLG_SYSTEM_CONTENTIMAGEUPLOAD_FOLDER_FORMAT_DESC="<strong>Переменные для путей</strong><br>{user_id} — ID текущего пользователя<br>{year} — текущий год<br>{month} — текущий месяц<br>{week_year} — номер недели в году<br>{week_day} — порядковый номер дня недели (с 0)<br>{day_year} — порядковый номер дня в году (с 0)<br>{day} — текущий день<br>{hours} — часы в 12-часовом формате с ведущим нулём<br>{hours_24} — часы в 24-часовом формате с ведущим нулём<br>{minutes} — минуты<br>{seconds} — секунды<br>{unix} — время UNIX в секундах<br><br><strong>Пример использования:</strong><br>images/{user_id}/{year}-{month}-{day}<br>images/{user_id}/{year}/{month}/{day}<br><br>По умолчанию используется: images/{year}/{month}/{day}. Путь можно изменить вручную в настройках плагина."
